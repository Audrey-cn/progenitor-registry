name: Daily Gene Scan

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      strict_l2:
        description: 'Block on content-address mismatches'
        required: false
        default: 'false'
      strict_l4:
        description: 'Block on quality warnings'
        required: false
        default: 'false'

jobs:
  scan_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scan report
        run: |
          python3 .github/workflows/gatekeeper.py --scan-only || true

      - name: Publish audit summary
        if: always()
        run: |
          echo '## Gatekeeper audit summary' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .gatekeeper_audit.jsonl ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 .gatekeeper_audit.jsonl >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No audit records generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## Repository stats' >> "$GITHUB_STEP_SUMMARY"
          echo "- Gene files: $(find genes -maxdepth 1 -type f 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Index lines: $(wc -l .akashic_index.json 2>/dev/null | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-audit-logs
          path: |
            .gatekeeper_audit.jsonl
            .gatekeeper_rejections.jsonl
          if-no-files-found: ignore

  strict_gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.strict_l2 == 'true' || inputs.strict_l4 == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run strict gate
        env:
          GATEKEEPER_STRICT_L2: ${{ inputs.strict_l2 == 'true' && '1' || '0' }}
          GATEKEEPER_STRICT_L4: ${{ inputs.strict_l4 == 'true' && '1' || '0' }}
        run: python3 .github/workflows/gatekeeper.py --scan-only
